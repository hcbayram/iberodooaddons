name: Build & Package Odoo Addons

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to Build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'iber_edonusum'
          - 'iber_edonusum_uyumsoft'
          - 'iber_edonusum_hizli'
          - 'iber_edonusum_nes'
          - 'iber_e_transform'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# ---------------------------------------------------------------------------
#  Detect which addons have changed
# ---------------------------------------------------------------------------

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      iber_edonusum: ${{ steps.filter.outputs.iber_edonusum }}
      iber_edonusum_uyumsoft: ${{ steps.filter.outputs.iber_edonusum_uyumsoft }}
      iber_edonusum_hizli: ${{ steps.filter.outputs.iber_edonusum_hizli }}
      iber_edonusum_nes: ${{ steps.filter.outputs.iber_edonusum_nes }}
      iber_e_transform: ${{ steps.filter.outputs.iber_e_transform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed addons
        id: filter
        run: |
          set_output() {
            local addon=$1
            local val=$2
            echo "${addon}=${val}" >> $GITHUB_OUTPUT
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODULE="${{ github.event.inputs.module }}"
            for addon in iber_edonusum iber_edonusum_uyumsoft iber_edonusum_hizli \
                         iber_edonusum_nes iber_e_transform; do
              if [ "$MODULE" = "all" ] || [ "$MODULE" = "$addon" ]; then
                set_output "$addon" "true"
              else
                set_output "$addon" "false"
              fi
            done
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
            echo "Changed files:"
            echo "$CHANGED"

            for addon in iber_edonusum iber_edonusum_uyumsoft iber_edonusum_hizli \
                         iber_edonusum_nes iber_e_transform; do
              if echo "$CHANGED" | grep -q "^${addon}/"; then
                set_output "$addon" "true"
              else
                set_output "$addon" "false"
              fi
            done
          fi

          echo "=== Results ==="
          cat $GITHUB_OUTPUT

# ---------------------------------------------------------------------------
#  Cython addon build jobs
# ---------------------------------------------------------------------------

  build-iber-edonusum:
    needs: detect-changes
    if: needs.detect-changes.outputs.iber_edonusum == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython wheel setuptools requests
      - name: Build Cython extensions
        working-directory: iber_edonusum
        run: python setup.py build_ext --inplace
      - name: Copy .pyd files to core/
        working-directory: iber_edonusum
        run: |
          Get-ChildItem -Path build -Filter "*.pyd" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination "core\" -Force
          }
      - name: Test imports
        working-directory: iber_edonusum
        run: |
          python -c "from core import ubl_xml_parser; print('OK: ubl_xml_parser')"
          python -c "from core.ubl_xml_parser import parse_incoming_ubl_xml; print('OK: parse_incoming_ubl_xml')"
      - name: Prepare addon package
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
        run: |
          $addon = "iber_edonusum"
          $staging = "staging\$addon"
          $manifest = Get-Content "$addon\__manifest__.py" -Raw
          if ($manifest -match '["'']version["'']\s*:\s*["'']([^"'']+)["'']') { $version = $Matches[1] } else { $version = "0.0.0" }
          $versionTag = $version -replace '\.', '_'
          echo "ARTIFACT_NAME=$($addon)_$($versionTag)" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          robocopy $addon $staging /E /NFL /NDL /NJH /NJS /NC /NS /XD build __pycache__ .git .github /XF *.md setup.py build_cython.sh build_cython.bat build_cython.ps1 *.c *.html .DS_Store
          $roboExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($roboExit -ge 8) { throw "robocopy failed with exit code $roboExit" }
          $global:LASTEXITCODE = 0
          Get-ChildItem -Path "$addon\core" -Filter "*.pyd" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "$staging\core\" -Force
          }
          $pydFiles = @(Get-ChildItem -Path "$staging\core" -Filter "*.pyd" -ErrorAction SilentlyContinue)
          Get-ChildItem -Path "$staging\core\*.py" | Where-Object { $_.Name -ne "__init__.py" } | ForEach-Object {
            $pyBase = $_.BaseName
            $matchingPyd = $pydFiles | Where-Object { $_.Name -match "^$([regex]::Escape($pyBase))\.cp" }
            if ($matchingPyd) { Remove-Item $_.FullName -Force }
          }
          $info = "$addon - Release Package`r`nVersion: $version`r`nPython: 3.12 (x64)`r`nBuild Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`r`nCommit: $env:GH_SHA`r`nBranch: $env:GH_REF`r`n"
          $info | Out-File -FilePath "$staging\BUILD_INFO.txt" -Encoding UTF8
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: staging/
          retention-days: 90

