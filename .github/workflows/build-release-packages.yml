# ---------------------------------------------------------------------------
#  Non-Cython addon packaging jobs
# ---------------------------------------------------------------------------

  package-addon:
    needs: detect-changes
    if: needs.detect-changes.outputs.iber_e_transform == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: iber_e_transform
            condition: ${{ needs.detect-changes.outputs.iber_e_transform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skip if not changed
        if: matrix.condition != 'true'
        run: exit 0
      - name: Prepare addon package
        if: matrix.condition == 'true'
        env:
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
        run: |
          $addon = "${{ matrix.addon }}"
          $staging = "staging\$addon"
          $manifest = Get-Content "$addon\__manifest__.py" -Raw
          if ($manifest -match '["'']version["'']\s*:\s*["'']([^"'']+)["'']') { $version = $Matches[1] } else { $version = "0.0.0" }
          $versionTag = $version -replace '\.', '_'
          echo "ARTIFACT_NAME=$($addon)_$($versionTag)" >> $env:GITHUB_ENV
          Write-Host "Packaging $addon v$version"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          robocopy $addon $staging /E /NFL /NDL /NJH /NJS /NC /NS /XD build __pycache__ .git .github /XF *.md *.c *.html .DS_Store
          $roboExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($roboExit -ge 8) { throw "robocopy failed with exit code $roboExit" }
          $global:LASTEXITCODE = 0
          $commitMsg = git log -1 --pretty=format:"%s" 2>$null
          $info = "$addon - Release Package`r`nVersion: $version`r`nBuild Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')`r`nCommit: $env:GH_SHA`r`nMessage: $commitMsg`r`nBranch: $env:GH_REF`r`n"
          $info | Out-File -FilePath "$staging\BUILD_INFO.txt" -Encoding UTF8
      - name: Upload package
        if: matrix.condition == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: staging/
          retention-days: 90

# ---------------------------------------------------------------------------
#  Create GitHub Release (only on push to main/master)
# ---------------------------------------------------------------------------

  create-release:
    needs:
      - detect-changes
      - build-iber-edonusum
      - build-iber-edonusum-uyumsoft
      - build-iber-edonusum-hizli
      - build-iber-edonusum-nes
      - package-addon
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.build-iber-edonusum.result == 'success' ||
       needs.build-iber-edonusum-uyumsoft.result == 'success' ||
       needs.build-iber-edonusum-hizli.result == 'success' ||
       needs.build-iber-edonusum-nes.result == 'success' ||
       needs.package-addon.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create release zips
        run: |
          mkdir -p release_zips
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/

          for artifact_dir in artifacts/*/; do
            artifact_name=$(basename "$artifact_dir")
            echo "--- Processing: $artifact_name ---"
            cd "$artifact_dir"
            zip -r "../../release_zips/${artifact_name}.zip" .
            cd ../..
            size=$(du -h "release_zips/${artifact_name}.zip" | cut -f1)
            echo "Created: ${artifact_name}.zip ($size)"
          done

          echo ""
          echo "=== Release zips ==="
          ls -la release_zips/

      - name: Create release tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-build.${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          body: |
            ## Addon Packages — Odoo 19 (İberoDoo e-Fatura)

            Kuruluma hazır Odoo 19 addon paketleri.
            Zip dosyasını Odoo addons klasörüne extract edin.

            **Python**: 3.12 (x64, Windows)
            **Commit**: ${{ github.sha }}

            ### Cython (Derlenmiş) Paketler
            - `iber_edonusum` — E-Dönüşüm Çerçevesi (Fatura Entegratör Senkronizasyonu)
            - `iber_edonusum_uyumsoft` — Uyumsoft e-Fatura/e-Arşiv Entegratörü
            - `iber_edonusum_hizli` — Hızlı Teknoloji e-Dönüşüm Entegratörü
            - `iber_edonusum_nes` — NES e-Dönüşüm Entegratörü

            ### Standart Paketler
            - `iber_e_transform` — UBL Dönüşüm Çerçevesi
          files: release_zips/*.zip
          draft: false
          prerelease: false
